name: Mirror feeds

# Fetches the upstream's JSON feeds (the two CPE tarballs and every CVE feed) with
# their .meta files, verifies them, and replaces the changed ones in one rolling
# GitHub release, so a worker can download them from GitHub's CDN. Daily after the
# upstream's nightly rebuild, by hand from the Actions tab, or on demand through the
# API (repository_dispatch with event_type "mirror").
# Set the repository secret SOURCE_BASE to the feeds' root with its trailing slash
# (Settings → Secrets and variables → Actions → Secrets); it is masked in every log.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [mirror]

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: feeds
      BUDGET_SECONDS: "15000"
      PARALLEL: "4"
      SEGMENTS: "6"
      SEGMENT_MIB: "32"
      PROGRESS_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - name: refuse without the source secret
        env:
          BASE: ${{ secrets.SOURCE_BASE }}
        run: |
          if [ -z "$BASE" ]; then echo "::error::repository secret SOURCE_BASE is not set"; exit 1; fi
      - name: Fetch, verify and publish changed feeds
        env:
          BASE: ${{ secrets.SOURCE_BASE }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SPACES_REGION: sgp1
        run: ./mirror.sh
